<title>Four Notes brand board source</title>

<style>
  /* The source of assets/brand/four-notes-brand-board.png: a 1920 × 1200 board, ink frame and paper sheets. */
  html, body { background: var(--ink); overflow: visible; }
  .board { width: 1920px; height: 1200px; padding: 16px; display: grid; grid-template-columns: 1.16fr 1fr 1.16fr; grid-template-rows: 1fr 1fr 1fr; gap: 12px; background: var(--ink); }
  .p { position: relative; overflow: hidden; border-radius: 20px; background: var(--paper); }
  .p.ink { background: var(--ink-2); color: #fff; }
  .p.pa2 { background: var(--paper-2); }
  .lb { position: absolute; left: 24px; bottom: 18px; font-size: 14px; font-weight: 500; color: var(--meta); }
  .ink .lb { color: var(--on-2); }
  .no { position: absolute; right: 24px; bottom: 18px; font-size: 14px; font-weight: 500; color: var(--meta); font-variant-numeric: tabular-nums; }
  .ink .no { color: var(--on-2); }
  .c { position: absolute; inset: 0; display: grid; place-items: center; }

  .cover .lock { display: flex; align-items: center; gap: 18px; color: var(--logo-ink); }
  .cover svg { width: 190px; height: 190px; }
  .cover b { font-size: 74px; font-weight: 640; letter-spacing: -0.045em; color: var(--text); }

  .cons svg { width: 92%; height: 100%; }

  .ui { background: var(--ink); }
  .ui img { position: absolute; left: 40px; top: 34px; width: 760px; max-width: none; border-radius: 16px; }

  .ess { display: grid; align-content: center; padding: 0 40px; font-size: 92px; font-weight: 640; line-height: 1; letter-spacing: -0.045em; }

  .cols { display: grid; grid-template-columns: 2.2fr 2.2fr 1.3fr 0.45fr 0.45fr; height: 100%; }
  .cols div { position: relative; padding: 18px 16px; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .cols span { position: absolute; left: 16px; bottom: 16px; font-weight: 500; opacity: 0.8; font-variant-numeric: tabular-nums; }

  .ty { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 30px; padding: 0 40px; height: 100%; }
  .ty b { font-size: 188px; font-weight: 640; line-height: 1; letter-spacing: -0.05em; }
  .ty p { font-size: 22px; font-weight: 500; line-height: 1.35; letter-spacing: -0.012em; }
  .ty p span { display: block; color: var(--meta); font-weight: 400; font-size: 18px; }

  .books { display: flex; align-items: flex-end; justify-content: center; gap: 12px; height: 100%; padding: 34px 30px 0; }
  .book { position: relative; flex: 0 0 132px; height: 268px; border-radius: 10px 14px 0 0; }
  .book::before { content: ''; position: absolute; inset: 0 auto 0 12px; width: 2px; background: rgba(0, 0, 0, 0.12); }
  .book svg { position: absolute; left: 50%; top: 34px; width: 48px; height: 48px; margin-left: -19px; overflow: visible; }
  .book.a { background: var(--ink); color: var(--paper); }
  .book.b { background: #fff; }
  .book.c2 { background: var(--spark); height: 300px; }
  .book.d { background: var(--paper-3); height: 244px; }

  .tex svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .sys { display: grid; align-content: center; justify-items: start; gap: 18px; padding: 0 40px; }
  .sys .mks { display: flex; gap: 12px; }
  .sys .mks svg { width: 44px; height: 44px; overflow: visible; }
  .sys .omni { width: 100%; pointer-events: none; }
  .sys .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sys .tag { height: 26px; font-size: 13.5px; }
</style>
